# RT5370 USB WiFi dongle (Ralink RT2800USB driver)
# Enables the rt2x00 driver stack for USB-attached WiFi adapters
# such as the Ralink RT5370, RT3070, RT2870 found on Raspberry Pi 1/2/Zero
CONFIG_RT2X00=m
CONFIG_RT2800_LIB=m
CONFIG_RT2800_LIB_MMIO=m
CONFIG_RT2800USB=m
CONFIG_RT2X00_LIB=m
CONFIG_RT2X00_LIB_USB=m
CONFIG_RT2X00_LIB_FIRMWARE=m
CONFIG_RT2X00_LIB_CRYPTO=m
