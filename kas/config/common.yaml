# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/66261547b75885786777a0b9c8a4400ab81d432e/kas/schema-kas.json
header:
  version: 14

bblayers_conf_header:
  meta-common: |
    POKY_BBLAYERS_CONF_VERSION = "2"

local_conf_header:
  meta-common: |
    BB_ENV_PASSTHROUGH_ADDITIONS = "SSTATE_DIR"
    BB_HASHSERVE_DB_DIR = "${SSTATE_DIR}"

    # conserve disk space during a build
    INHERIT += "rm_work"

    PACKAGE_CLASSES ?= "package_deb"
    VOLATILE_LOG_DIR = "no"
    IMAGE_INSTALL:append = " gnupg"
    IMAGE_INSTALL:append = " systemd-journald-defaults"
    EXTRA_IMAGE_FEATURES:append = " allow-empty-password allow-root-login empty-root-password ssh-server-dropbear"
    INIT_MANAGER = "systemd"
    TEDGE_CONFIG_DIR = "/etc/tedge"

    # customize tedge features
    TEDGE_FEATURES_ENABLE:append = " tedge-collectd tedge-docker tedge-p11-kit"

    # enable CVE checks (wrynose: sbom-cve-check replaces removed cve-check class)
    OE_FRAGMENTS += "core/yocto/sbom-cve-check"
    # preserve the legacy .cve.txt summary file in DEPLOY_DIR_IMAGE
    SBOM_CVE_CHECK_EXPORT_VARS:append = " SBOM_CVE_CHECK_EXPORT_SUMMARY"

    # preferred thin-edge.io version
    # Use "1.X%" if you want to use the latest from the main branch
    #PREFERRED_VERSION_tedge ?= "2.0.1"

    # Add /etc/buildinfo file with information about build
    INHERIT += "image-buildinfo"
    IMAGE_BUILDINFO_FILE = "${sysconfdir}/buildinfo"
    IMAGE_BUILDINFO_VARS:append = " DATETIME DISTRO_NAME IMAGE_BASENAME IMAGE_NAME IMAGE_NAME_SUFFIX MACHINE TUNE_PKGARCH" 
    IMAGE_BUILDINFO_VARS:append = " MACHINE_FEATURES DISTRO_FEATURES COMMON_FEATURES IMAGE_FEATURES"
    IMAGE_BUILDINFO_VARS:append = " TUNE_FEATURES TARGET_FPU"
    IMAGE_BUILDINFO_VARS:append = " DEVICE_MODEL"

    # Don't enable service by default as they will need to be bootstrapped first, though
    # this may change in the future. But bootstrapping works anyway if the services are already enabled
    # but they do consume more resources until it is bootstrapped
    SYSTEMD_AUTO_ENABLE:tedge-agent = "disable"
    SYSTEMD_AUTO_ENABLE:tedge-mapper-c8y = "disable"
    SYSTEMD_AUTO_ENABLE:tedge-mapper-aws = "disable"
    SYSTEMD_AUTO_ENABLE:tedge-mapper-az = "disable"
    SYSTEMD_AUTO_ENABLE:tedge-mapper-collectd = "disable"
    SYSTEMD_AUTO_ENABLE:tedge-mapper-local = "disable"
    SYSTEMD_AUTO_ENABLE:tedge-p11-server = "enable"

    # Opt out of new DISTRO_FEATURES defaults introduced in Yocto 6.0 that are
    # not relevant for embedded/IoT builds.
    DISTRO_FEATURES_OPTED_OUT = "multiarch opengl ptest vulkan wayland"
