# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/66261547b75885786777a0b9c8a4400ab81d432e/kas/schema-kas.json
header:
  version: 14

local_conf_header:
  meta-monitor: |
    IMAGE_INSTALL:append = " monit"

    # collectd
    IMAGE_INSTALL:append = " libmosquitto1 libmosquittopp1"
    PACKAGECONFIG:append:pn-collectd = " mqtt"
    SYSTEMD_AUTO_ENABLE:tedge-mapper-collectd = "enable"
