# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/66261547b75885786777a0b9c8a4400ab81d432e/kas/schema-kas.json
header:
  version: 14
  includes:
    - ../config/common.yaml
    - ../config/raspberrypi.yaml
    - ../config/rugix.yaml
    - ../config/rugix-raspberrypi.yaml
    - ../config/network.yaml
    - ../config/monitor.yaml
    - ../config/package-management.yaml
    - ../config/tedge-docker.yaml
    - ../config/tedge-nodered.yaml

machine: raspberrypi-armv8
distro: poky
target: rugix-update-bundle

env:
  IMAGE_VERSION: ""
  IMAGE_VERSION_SUFFIX: "_123123"
  RUGIX_BUNDLE_NAME: "core-image-tedge-rugix-${MACHINE}${IMAGE_VERSION_SUFFIX}"

defaults:
  repos:
    branch: kirkstone

repos:
  poky:
    url: "https://git.yoctoproject.org/git/poky"
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-raspberrypi:
    url: "https://github.com/agherzan/meta-raspberrypi.git"

  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:
      meta-filesystems:

  meta-rugix:
    url: "https://github.com/silitics/meta-rugix.git"
    branch: main
    layers:
      meta-rugix-core:
      meta-rugix-rpi-tryboot:

  meta-tedge:
    path: ../../
    layers:
      meta-tedge:
      meta-tedge-common:
      meta-tedge-rugix:
      meta-tedge-extras:
      meta-raspberrypi:

  meta-lts-mixins-rust:
    url: "https://git.yoctoproject.org/meta-lts-mixins"
    branch: kirkstone/rust

  meta-lts-mixins-go:
    url: "https://git.yoctoproject.org/meta-lts-mixins"
    branch: kirkstone/go

  meta-virtualization:
    url: "https://git.yoctoproject.org/meta-virtualization"
