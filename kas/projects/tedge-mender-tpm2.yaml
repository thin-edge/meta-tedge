# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/66261547b75885786777a0b9c8a4400ab81d432e/kas/schema-kas.json
header:
  version: 14
  includes:
    - ../config/common.yaml
    - ../config/raspberrypi.yaml
    - ../config/usb-wifi.yaml
    - ../config/mender-raspberrypi.yaml
    - ../config/network.yaml
    - ../config/monitor.yaml
    - ../config/package-management.yaml
    - ../config/tedge-docker.yaml
    - ../config/tedge-nodered.yaml
    - ../config/raspberrypi-tpm2.yaml

machine: raspberrypi-armv8
distro: poky
target: core-image-tedge-mender

env:
  IMAGE_VERSION_SUFFIX: "_123123"
  MENDER_ARTIFACT_NAME: "core-image-tedge-mender-${MACHINE}${IMAGE_VERSION_SUFFIX}"

defaults:
  repos:
    branch: wrynose

repos:
  bitbake:
    url: "https://github.com/openembedded/bitbake.git"
    tag: yocto-6.0
    branch: ""
    # this repo does not provide any layers
    layers: {}

  meta-yocto:
    url: "https://git.yoctoproject.org/meta-yocto"
    layers:
      meta-poky:
      meta-yocto-bsp:

  openembedded-core:
    url: "https://github.com/openembedded/openembedded-core.git"
    layers:
      meta:

  meta-raspberrypi:
    url: "https://github.com/agherzan/meta-raspberrypi.git"
    branch: master

  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:
      meta-filesystems:

  # Required for tpm2
  meta-security:
    url: "https://git.yoctoproject.org/meta-security"
    layers:
      .:
      meta-tpm:

  meta-mender:
    url: "https://github.com/mendersoftware/meta-mender"
    layers:
      meta-mender-core:

  meta-mender-community:
    url: "https://github.com/mendersoftware/meta-mender-community"
    layers:
      meta-mender-raspberrypi:

  meta-tedge:
    path: ../../
    layers:
      meta-tedge:
      meta-tedge-common:
      meta-tedge-mender:
      meta-tedge-extras:
      meta-raspberrypi:
      meta-slb9670-rpi:

  meta-virtualization:
    url: "https://git.yoctoproject.org/meta-virtualization"

  meta-clang:
    url: "https://github.com/kraj/meta-clang.git"
