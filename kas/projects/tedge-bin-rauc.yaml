# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/66261547b75885786777a0b9c8a4400ab81d432e/kas/schema-kas.json
header:
  version: 14
  includes:
    - ../config/common.yaml
    - ../config/raspberrypi.yaml
    - ../config/usb-wifi.yaml
    - ../config/rauc-raspberrypi.yaml
    - ../config/network.yaml
    - ../config/monitor.yaml
    - ../config/package-management.yaml
    - ../config/tedge-docker.yaml
    - ../config/tedge-nodered.yaml
    # Note: tedge-p11-server is not yet available in the meta-tedge-bin layer
    - ../config/skip-tedge-p11-server.yaml

machine: raspberrypi-armv8
distro: poky
target: rauc-update-bundle

env:
  IMAGE_VERSION: ""
  IMAGE_VERSION_SUFFIX: "_123123"
  BUNDLE_NAME: "core-image-tedge-rauc-${MACHINE}${IMAGE_VERSION_SUFFIX}"
  RAUC_BUNDLE_VERSION: "${IMAGE_VERSION}"

defaults:
  repos:
    branch: wrynose

repos:
  bitbake:
    url: "https://github.com/openembedded/bitbake.git"
    tag: yocto-6.0
    branch: ""
    # this repo does not provide any layers
    layers: {}

  meta-yocto:
    url: "https://git.yoctoproject.org/meta-yocto"
    layers:
      meta-poky:
      meta-yocto-bsp:

  openembedded-core:
    url: "https://github.com/openembedded/openembedded-core.git"
    layers:
      meta:

  meta-raspberrypi:
    url: "https://github.com/agherzan/meta-raspberrypi.git"
    branch: master

  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:
      meta-filesystems:

  meta-rauc:
    url: "https://github.com/rauc/meta-rauc.git"

  meta-rauc-community:
    url: "https://github.com/rauc/meta-rauc-community"
    branch: master
    layers:
      meta-rauc-raspberrypi:

  meta-tedge:
    path: ../../
    layers:
      meta-tedge-bin:
      meta-tedge-common:
      meta-tedge-rauc:
      meta-tedge-extras:
      meta-raspberrypi:

  meta-virtualization:
    url: "https://git.yoctoproject.org/meta-virtualization"
