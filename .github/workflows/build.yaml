name: build

on:
  push:
    branches:
      - scarthgap
      - wrynose
  workflow_dispatch:
  pull_request:
    types: [ labeled ]

permissions:
  contents: read

env:
  SSTATE_DIR: /data/yocto/sstate-cache
  DL_DIR: /data/yocto/downloads

jobs:
  approve:
    name: Approve
    environment:
      name: ${{ github.event_name == 'pull_request' && 'test-pr' || 'test-branch'  }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for approval
        run: echo "Approved"

  build:
    name: Build ${{ matrix.project }} ${{ matrix.machine }}
    if: |
      github.event_name != 'pull_request' || 
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci'))
    needs: [approve]
    runs-on:
      - self-hosted
      - Linux
      - X64
      - offsite_yocto
    strategy:
      fail-fast: false
      matrix:
        project:
          - tedge-rauc-tpm2
          - tedge-mender-tpm2
          - tedge-rugix-tpm2
        machine:
          - raspberrypi
          - raspberrypi2
          # RaspberryPi 64 bit: 3b, 4, 5, zero2w, cm3, cm4, cm4s
          # https://git.yoctoproject.org/meta-raspberrypi/tree/conf/machine/raspberrypi-armv8.conf?h=master
          - raspberrypi-armv8
        include:
          - project: tedge-rauc-tpm2
            image_name: core-image-tedge-rauc
            image_ext: "wic.bz2"
            update_ext: "raucb"
            manifest_ext: "manifest"

          - project: tedge-mender-tpm2
            image_name: core-image-tedge-mender
            image_ext: "sdimg.bz2"
            update_ext: "mender"
            manifest_ext: "manifest"

          - project: tedge-rugix-tpm2
            image_name: core-image-tedge-rugix
            image_ext: "wic.bz2"
            update_ext: "rugixb"
            manifest_ext: "manifest"
        
        exclude:
          - project: tedge-rugix-tpm2
            machine: raspberrypi

          - project: tedge-rugix-tpm2
            machine: raspberrypi2

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Only install tooling if not running on a self-hosted runner as the tools are already pre-installed
      - uses: taiki-e/install-action@just
        if: ${{ !startsWith(runner.name, 'tedge') }}
      - uses: actions/setup-python@v5
        if: ${{ !startsWith(runner.name, 'tedge') }}
        with:
          python-version: '3.8'
      - run: pip3 install kas
        if: ${{ !startsWith(runner.name, 'tedge') }}

      # Sign RAUC bundles with the thin-edge.io release signer. Pull requests
      # (including forks, which have no access to secrets) fall back to the
      # public development keys.
      - name: Configure RAUC signing
        if: ${{ matrix.update_ext == 'raucb' }}
        env:
          IS_RELEASE_SIGNING: ${{ github.event_name != 'pull_request' }}
          RAUC_SIGNING_KEY: ${{ secrets.RAUC_SIGNING_KEY }}
          RAUC_SIGNING_CERT: ${{ vars.RAUC_SIGNING_CERT }}
          RAUC_INTERMEDIATE: ${{ vars.RAUC_INTERMEDIATE }}
          RAUC_KEYRING: ${{ vars.RAUC_KEYRING }}
        run: |
          if [ "$IS_RELEASE_SIGNING" != "true" ] || [ -z "$RAUC_SIGNING_KEY" ] || [ -z "$RAUC_SIGNING_CERT" ] || [ -z "$RAUC_KEYRING" ]; then
            echo "::warning title=RAUC development keys::RAUC bundles are signed with the public development keys (not for production)"
            exit 0
          fi
          PKI_DIR="$RUNNER_TEMP/rauc-pki"
          (umask 077 && mkdir -p "$PKI_DIR" && printf '%s\n' "$RAUC_SIGNING_KEY" > "$PKI_DIR/signer.key.pem")
          printf '%s\n' "$RAUC_SIGNING_CERT" > "$PKI_DIR/signer.cert.pem"
          printf '%s\n' "$RAUC_KEYRING" > "$PKI_DIR/ca.cert.pem"
          VERIFY_ARGS=()
          if [ -n "$RAUC_INTERMEDIATE" ]; then
            printf '%s\n' "$RAUC_INTERMEDIATE" > "$PKI_DIR/intermediate.cert.pem"
            VERIFY_ARGS=(-untrusted "$PKI_DIR/intermediate.cert.pem")
            echo "RAUC_INTERMEDIATE_FILE=$PKI_DIR/intermediate.cert.pem" >> "$GITHUB_ENV"
          fi
          openssl verify -CAfile "$PKI_DIR/ca.cert.pem" "${VERIFY_ARGS[@]}" "$PKI_DIR/signer.cert.pem"
          {
            echo "RAUC_KEY_FILE=$PKI_DIR/signer.key.pem"
            echo "RAUC_CERT_FILE=$PKI_DIR/signer.cert.pem"
            echo "RAUC_KEYRING_FILE=$PKI_DIR/ca.cert.pem"
          } >> "$GITHUB_ENV"

      - name: Build
        run: just build-project projects/${{ matrix.project }}.yaml || { echo "::warning title=Retried build for ${{ matrix.project }} ${{ matrix.machine }}::The initial build failed and retried." && just build-project projects/${{ matrix.project }}.yaml; }
        working-directory: kas
        env:
          KAS_MACHINE: ${{ matrix.machine }}

      # Don't leave the signing key on the (self-hosted) runner
      - name: Remove RAUC signing key
        if: ${{ always() && matrix.update_ext == 'raucb' }}
        run: rm -rf "$RUNNER_TEMP/rauc-pki"

      # Delete any symlinks as this affects the artifact upload pattern
      - name: Delete image symlinks
        run: |
          find "kas/build/tmp/deploy/images/${{ matrix.machine }}/" -type l -name "${{ matrix.image_name }}*" -delete

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image_name }}_${{ matrix.machine }}
          path: |
            kas/build/tmp/deploy/images/${{ matrix.machine }}/${{ matrix.image_name }}*${{ matrix.machine }}*.${{ matrix.image_ext }}
            kas/build/tmp/deploy/images/${{ matrix.machine }}/${{ matrix.image_name }}*${{ matrix.machine }}*.${{ matrix.update_ext }}
            kas/build/tmp/deploy/images/${{ matrix.machine }}/${{ matrix.image_name }}*${{ matrix.machine }}*.${{ matrix.manifest_ext }}
            kas/build/tmp/deploy/images/${{ matrix.machine }}/${{ matrix.image_name }}*${{ matrix.machine }}*.spdx.tar.zst
            kas/build/tmp/deploy/images/${{ matrix.machine }}/${{ matrix.image_name }}*${{ matrix.machine }}*.cve.json
